<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mic dB Meter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    font-family: 'Consolas', 'Courier New', monospace;
    overflow: hidden;
    user-select: none;
  }

  #container {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 8px 12px;
  }

  /* --- Start overlay (shown before mic access) --- */
  #start-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.85);
    z-index: 100;
    cursor: pointer;
  }

  #start-overlay .overlay-content {
    text-align: center;
    max-width: 520px;
    padding: 0 20px;
  }

  #start-overlay span {
    color: #ccc;
    font-size: 14px;
    letter-spacing: 0.5px;
  }

  #start-overlay.hidden { display: none; }

  /* --- OBS error message --- */
  .obs-error-title {
    color: #ff6666;
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 12px;
  }

  .obs-error-steps {
    color: #aaa;
    font-size: 11px;
    text-align: left;
    line-height: 1.8;
    margin-top: 8px;
  }

  .obs-error-steps code {
    background: rgba(255, 255, 255, 0.1);
    padding: 2px 6px;
    border-radius: 3px;
    color: #ffaa00;
    font-size: 11px;
    word-break: break-all;
  }

  .obs-error-steps ol {
    padding-left: 18px;
    margin: 6px 0;
  }

  .obs-error-steps li {
    margin-bottom: 4px;
  }

  .obs-error-hint {
    color: #666;
    font-size: 10px;
    margin-top: 12px;
  }

  /* --- dB readouts row (below bar) --- */
  #readouts {
    display: flex;
    align-items: baseline;
    gap: 20px;
    margin-top: 6px;
    height: 36px;
  }

  .db-value {
    font-size: 28px;
    font-weight: bold;
    line-height: 1;
    min-width: 100px;
    text-align: right;
  }

  .db-label {
    font-size: 12px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  #current-db { color: #ffffff; text-shadow: 0 0 8px rgba(255,255,255,0.5); }
  #peak-db    { color: #ff4444; }
  .threshold-value { color: #ffaa00; }

  .db-unit {
    font-size: 13px;
    font-weight: normal;
    color: #888;
    margin-left: 2px;
  }

  /* --- Threshold section (hideable) --- */
  #threshold-section {
    margin-top: 10px;
    border-top: 1px solid #333;
    padding-top: 8px;
  }

  #threshold-section.hidden { display: none; }

  #threshold-label-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  #threshold-label-row .db-label {
    font-size: 11px;
  }

  /* --- Threshold slider --- */
  #threshold-control {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* --- Threshold marker on meter bar --- */
  #threshold-marker {
    position: absolute;
    top: 0;
    height: 100%;
    width: 2px;
    background: #ffaa00;
    z-index: 4;
    left: 0%;
    transition: left 0.1s linear;
    pointer-events: none;
  }

  /* --- Toggle button for threshold visibility --- */
  #toggle-threshold-btn {
    background: none;
    border: 1px solid #444;
    color: #888;
    font-size: 9px;
    padding: 1px 8px;
    border-radius: 2px;
    cursor: pointer;
    font-family: inherit;
  }

  #toggle-threshold-btn:hover {
    border-color: #ffaa00;
    color: #ffaa00;
  }

  #threshold-slider {
    width: 100%;
    height: 6px;
    -webkit-appearance: none;
    appearance: none;
    background: #333;
    border-radius: 3px;
    outline: none;
    cursor: pointer;
  }

  #threshold-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    background: #ffaa00;
    border-radius: 50%;
    cursor: pointer;
  }

  #threshold-slider::-moz-range-thumb {
    width: 14px;
    height: 14px;
    background: #ffaa00;
    border-radius: 50%;
    border: none;
    cursor: pointer;
  }

  /* --- Red bar override when exceeding threshold --- */
  #level-bar.over-threshold {
    background: linear-gradient(to right, #ff2222, #ff4444, #ff0000) !important;
  }

  /* --- Meter bar --- */
  #meter-wrap {
    position: relative;
    width: 100%;
    height: 28px;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 3px;
    overflow: hidden;
  }

  /* Tick marks */
  #ticks {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 3;
  }

  .tick {
    position: absolute;
    top: 0;
    width: 1px;
    height: 100%;
    background: rgba(255, 255, 255, 0.08);
  }

  .tick-label {
    position: absolute;
    bottom: 1px;
    font-size: 7px;
    color: rgba(255, 255, 255, 0.25);
    transform: translateX(-50%);
  }

  /* Current level fill */
  #level-bar {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 0%;
    border-radius: 2px 0 0 2px;
    z-index: 1;
    transition: width 0.04s linear;
  }

  /* Peak hold marker */
  #peak-marker {
    position: absolute;
    top: 0;
    height: 100%;
    width: 3px;
    background: #ff4444;
    box-shadow: 0 0 6px #ff4444, 0 0 12px rgba(255, 68, 68, 0.4);
    z-index: 2;
    left: 0%;
    transition: left 0.06s linear;
  }

  /* --- Scale labels below bar --- */
  #scale {
    display: flex;
    justify-content: space-between;
    margin-top: 2px;
    font-size: 8px;
    color: #555;
    padding: 0 1px;
  }

  /* --- Reset hint --- */
  #reset-hint {
    margin-left: auto;
    font-size: 9px;
    color: #555;
    align-self: center;
    display: flex;
    gap: 6px;
  }

  #reset-btn {
    background: none;
    border: 1px solid #444;
    color: #888;
    font-size: 9px;
    padding: 1px 8px;
    border-radius: 2px;
    cursor: pointer;
    font-family: inherit;
  }

  #reset-btn:hover {
    border-color: #ff4444;
    color: #ff4444;
  }
</style>
</head>
<body>

<div id="start-overlay">
  <div class="overlay-content">
    <span>Click to start microphone</span>
  </div>
</div>

<div id="container">
  <div id="meter-wrap">
    <div id="level-bar"></div>
    <div id="peak-marker"></div>
    <div id="threshold-marker"></div>
    <div id="ticks"></div>
  </div>

  <div id="scale">
    <span>0</span>
    <span>12</span>
    <span>24</span>
    <span>36</span>
    <span>48</span>
    <span>54</span>
    <span>60 dB</span>
  </div>

  <div id="readouts">
    <div>
      <span class="db-label">Level</span><br>
      <span id="current-db" class="db-value">0.0<span class="db-unit"> dB</span></span>
    </div>
    <div>
      <span class="db-label">Peak</span><br>
      <span id="peak-db" class="db-value">0.0<span class="db-unit"> dB</span></span>
    </div>
    <div id="reset-hint">
      <button id="reset-btn" title="Reset peak hold">RESET PEAK</button>
      <button id="toggle-threshold-btn" title="Show/hide threshold">THRESHOLD</button>
    </div>
  </div>

  <div id="threshold-section">
    <div id="threshold-label-row">
      <span class="db-label">Threshold</span>
      <span id="threshold-display" class="db-value threshold-value" style="font-size:20px;min-width:auto;"><span id="threshold-text">54.0</span><span class="db-unit"> dB</span></span>
    </div>
    <div id="threshold-control">
      <input type="range" id="threshold-slider" min="0" max="60" step="1" value="54">
    </div>
  </div>
</div>

<script>
(() => {
  /* ---- constants ---- */
  const DB_MIN   = -60;   // left edge of meter
  const DB_MAX   =   0;   // right edge (0 dBFS)
  const DB_RANGE = DB_MAX - DB_MIN;
  const FFT_SIZE = 2048;

  /* ---- DOM refs ---- */
  const overlay          = document.getElementById('start-overlay');
  const levelBar         = document.getElementById('level-bar');
  const peakMarker       = document.getElementById('peak-marker');
  const thresholdMarker  = document.getElementById('threshold-marker');
  const currentEl        = document.getElementById('current-db');
  const peakEl           = document.getElementById('peak-db');
  const resetBtn         = document.getElementById('reset-btn');
  const ticksEl          = document.getElementById('ticks');
  const thresholdSlider  = document.getElementById('threshold-slider');
  const thresholdText    = document.getElementById('threshold-text');
  const thresholdSection = document.getElementById('threshold-section');
  const toggleThreshBtn  = document.getElementById('toggle-threshold-btn');

  /* ---- state ---- */
  let peakDb      = -Infinity;
  let thresholdDisplay = 54;  // displayed dB (0-60 scale)
  let running     = false;

  /* ---- threshold helpers ---- */
  function displayToInternal(d) { return d - 60; } // 54 display → -6 internal
  function internalToDisplay(i) { return i + 60; } // -6 internal → 54 display

  let thresholdDb = displayToInternal(thresholdDisplay); // internal dBFS

  /* ---- threshold slider ---- */
  thresholdSlider.addEventListener('input', () => {
    thresholdDisplay = parseFloat(thresholdSlider.value);
    thresholdDb = displayToInternal(thresholdDisplay);
    thresholdText.textContent = thresholdDisplay.toFixed(1);
    thresholdMarker.style.left = ((thresholdDisplay / 60) * 100) + '%';
  });

  // Initial threshold marker position
  thresholdMarker.style.left = ((thresholdDisplay / 60) * 100) + '%';

  /* ---- threshold toggle ---- */
  function setThresholdVisible(visible) {
    if (visible) {
      thresholdSection.classList.remove('hidden');
      thresholdMarker.style.display = '';
      toggleThreshBtn.style.borderColor = '#ffaa00';
      toggleThreshBtn.style.color = '#ffaa00';
    } else {
      thresholdSection.classList.add('hidden');
      thresholdMarker.style.display = 'none';
      toggleThreshBtn.style.borderColor = '';
      toggleThreshBtn.style.color = '';
    }
  }

  toggleThreshBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const isHidden = thresholdSection.classList.contains('hidden');
    setThresholdVisible(isHidden);
  });

  // Auto-hide threshold if ?hideThreshold=1 in URL (for OBS streaming)
  if (new URLSearchParams(window.location.search).get('hideThreshold') === '1') {
    setThresholdVisible(false);
  }

  /* ---- gradient helper ---- */
  function dbColor(pct) {
    // 0-60% green, 60-85% yellow, 85-100% red
    if (pct < 0.6)  return `hsl(${120 - pct * 40}, 90%, 45%)`;
    if (pct < 0.85) return `hsl(${60 - (pct - 0.6) * 200}, 95%, 50%)`;
    return `hsl(${10 - (pct - 0.85) * 66}, 100%, 50%)`;
  }

  function buildGradient() {
    const stops = [];
    for (let i = 0; i <= 20; i++) {
      const p = i / 20;
      stops.push(`${dbColor(p)} ${(p * 100).toFixed(1)}%`);
    }
    return `linear-gradient(to right, ${stops.join(', ')})`;
  }

  levelBar.style.background = buildGradient();

  /* ---- tick marks ---- */
  function drawTicks() {
    const dbs = [6, 12, 18, 24, 30, 36, 42, 48, 54, 57, 60];
    dbs.forEach(db => {
      const pct = (db / 60) * 100;
      const tick = document.createElement('div');
      tick.className = 'tick';
      tick.style.left = pct + '%';
      ticksEl.appendChild(tick);
    });
  }
  drawTicks();

  /* ---- helpers ---- */
  function dbToPercent(db) {
    return Math.max(0, Math.min(100, ((db - DB_MIN) / DB_RANGE) * 100));
  }

  function formatDb(db) {
    // Convert internal dBFS (-60..0) to display dB (0..60)
    const display = internalToDisplay(db);
    if (display <= 0) return '0.0';
    return display.toFixed(1);
  }

  /* ---- reset peak ---- */
  function resetPeak() {
    peakDb = -Infinity;
    peakMarker.style.left = '0%';
    peakEl.innerHTML = '0.0<span class="db-unit"> dB</span>';
  }

  resetBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    resetPeak();
  });

  /* ---- OBS detection ---- */
  const isOBS = !!window.obsstudio;

  function showOverlayError(message) {
    overlay.classList.remove('hidden');
    const content = overlay.querySelector('.overlay-content');
    content.innerHTML = message;
  }

  function showOBSError() {
    showOverlayError(`
      <div class="obs-error-title">OBS Browser Source: Microphone not available</div>
      <div class="obs-error-steps">
        OBS Browser Source (CEF) blocks microphone access by default.
        Two steps are needed to fix this:
        <br><br>
        <b>Step 1:</b> Launch OBS with these flags:
        <ol>
          <li>Close OBS completely</li>
          <li><b>Windows:</b> Right-click the OBS shortcut &rarr; Properties &rarr; set Target to:<br>
              <code>"C:\\Program Files\\obs-studio\\bin\\64bit\\obs64.exe" --enable-media-stream --use-fake-ui-for-media-stream</code></li>
          <li><b>Mac:</b> Open Terminal and run:<br>
              <code>/Applications/OBS.app/Contents/MacOS/OBS --enable-media-stream --use-fake-ui-for-media-stream</code></li>
          <li><b>Linux:</b> Run from terminal:<br>
              <code>obs --enable-media-stream --use-fake-ui-for-media-stream</code></li>
        </ol>
        <b>Step 2:</b> Serve via localhost (local files may be blocked):
        <ol>
          <li>Open a terminal in the folder containing this HTML file</li>
          <li>Run: <code>python -m http.server 8080</code> (or <code>python3 -m http.server 8080</code>)</li>
          <li>In OBS Browser Source, set URL to:<br>
              <code>http://localhost:8080/index.html</code><br>
              (uncheck "Local file")</li>
        </ol>
      </div>
      <div class="obs-error-hint">Click to retry after completing both steps</div>
    `);
  }

  function showGenericError() {
    showOverlayError('<span>Microphone access denied. Click to retry.</span>');
  }

  /* ---- main audio setup ---- */
  async function startAudio() {
    overlay.classList.add('hidden');
    if (running) return;
    running = true;

    // Check if getUserMedia is available at all
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      if (isOBS) {
        showOBSError();
      } else {
        showOverlayError('<span>getUserMedia is not supported in this browser.</span>');
      }
      running = false;
      return;
    }

    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    } catch (err) {
      if (isOBS) {
        showOBSError();
      } else {
        showGenericError();
      }
      running = false;
      return;
    }

    const audioCtx  = new (window.AudioContext || window.webkitAudioContext)();
    const source    = audioCtx.createMediaStreamSource(stream);
    const analyser  = audioCtx.createAnalyser();
    analyser.fftSize = FFT_SIZE;
    analyser.smoothingTimeConstant = 0.3;
    source.connect(analyser);

    const buf = new Float32Array(analyser.fftSize);

    function frame() {
      analyser.getFloatTimeDomainData(buf);

      // Compute RMS
      let sum = 0;
      for (let i = 0; i < buf.length; i++) {
        sum += buf[i] * buf[i];
      }
      const rms = Math.sqrt(sum / buf.length);
      const db  = rms > 0 ? 20 * Math.log10(rms) : -Infinity;

      // Clamp to range
      const clampedDb = Math.max(DB_MIN, Math.min(DB_MAX, db));
      const pct = dbToPercent(clampedDb);

      // Update level bar
      levelBar.style.width = pct + '%';

      // Check threshold — turn entire bar red when exceeded
      if (clampedDb >= thresholdDb && clampedDb > DB_MIN) {
        levelBar.classList.add('over-threshold');
      } else {
        levelBar.classList.remove('over-threshold');
      }

      // Update current dB text
      currentEl.innerHTML = formatDb(clampedDb) + '<span class="db-unit"> dB</span>';

      // Update peak
      if (clampedDb > peakDb) {
        peakDb = clampedDb;
        peakEl.innerHTML = formatDb(peakDb) + '<span class="db-unit"> dB</span>';
      }
      peakMarker.style.left = dbToPercent(peakDb) + '%';

      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  }

  /* ---- click to start / retry ---- */
  overlay.addEventListener('click', startAudio);

  /* ---- auto-start (works if OBS grants permissions or normal browser) ---- */
  startAudio();
})();
</script>
</body>
</html>
